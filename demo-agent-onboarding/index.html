<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeadSaver Onboarding</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 480px; height: 640px; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #1a73e8; color: #fff; padding: 16px 20px; }
    .chat-header h2 { font-size: 1rem; font-weight: 600; }
    .chat-header p { font-size: 0.78rem; opacity: 0.8; margin-top: 2px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; }
    .bubble.agent { background: #f0f2f5; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.user { background: #1a73e8; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble.system { background: #fff3cd; color: #856404; align-self: center; font-size: 0.8rem; border-radius: 8px; text-align: center; }
    .typing { align-self: flex-start; padding: 10px 14px; background: #f0f2f5; border-radius: 16px; border-bottom-left-radius: 4px; }
    .typing span { display: inline-block; width: 7px; height: 7px; background: #999; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    .input-area { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #eee; }
    .input-area input { flex: 1; border: 1px solid #ddd; border-radius: 24px; padding: 10px 16px; font-size: 0.9rem; outline: none; }
    .input-area input:focus { border-color: #1a73e8; }
    .input-area button { background: #1a73e8; color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .input-area button:disabled { background: #ccc; cursor: not-allowed; }
    .restart-btn { background: none; border: 1px solid #1a73e8; color: #1a73e8; border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; margin-left: auto; display: block; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <h2>LeadSaver — Business Onboarding</h2>
    <p>Set up your AI receptionist in 2 minutes</p>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" disabled />
    <button id="send" disabled>&#9658;</button>
  </div>
</div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let sessionId = null;
  let done = false;

  function addBubble(text, type) {
    const div = document.createElement('div');
    div.className = `bubble ${type}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function startSession() {
    sessionId = 'session_' + Date.now();
    showTyping();
    try {
      const res = await fetch('http://localhost:8000/onboarding/start', { method: 'POST' });
      const data = await res.json();
      removeTyping();
      addBubble(data.message, 'agent');
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    } catch (e) {
      removeTyping();
      addBubble('Could not connect to LeadSaver backend at localhost:8000. Is it running?', 'system');
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || done) return;
    input.value = '';
    sendBtn.disabled = true;
    input.disabled = true;

    addBubble(text, 'user');
    showTyping();

    try {
      const res = await fetch('http://localhost:8000/onboarding/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      removeTyping();
      addBubble(data.reply, 'agent');

      if (data.done) {
        done = true;
        addBubble('✅ Onboarding complete! Business saved to database.', 'system');
      } else {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    } catch (e) {
      removeTyping();
      addBubble('Error reaching backend. Check the server is running.', 'system');
      input.disabled = false;
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  startSession();
</script>
</body>
</html>
